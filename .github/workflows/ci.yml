name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Serveur (typage, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typage
        run: npm run typecheck
      - name: Tests (MongoDB en mémoire)
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  client:
    name: Client (typage, i18n, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Typage
        run: npm run typecheck
      - name: Cohérence des traductions
        run: npm run i18n:check
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  zap:
    name: Scan de sécurité (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: [server, client]
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compiler le client et le serveur
        run: |
          (cd client && npm ci && npx vite build)
          (cd server && npm ci && npm run build)
      - name: Démarrer l'application (clés jetables, base vide)
        working-directory: server
        env:
          NODE_ENV: production
          PORT: "4000"
          APP_URL: http://localhost:4000
          MONGODB_URI: mongodb://localhost:27017/zap
          SERVE_CLIENT: "true"
          CLIENT_DIST: ../client/dist
          CLIENT_DIR: ../clients/example
          STORAGE_DIR: /tmp/humanlink-zap
        run: |
          export JWT_SECRET=$(openssl rand -hex 32) FIELD_ENCRYPTION_KEY=$(openssl rand -hex 32) FILE_ENCRYPTION_KEY=$(openssl rand -hex 32) PSEUDONYM_KEY=$(openssl rand -hex 32)
          nohup node dist/index.js > /tmp/app.log 2>&1 &
          for i in $(seq 1 40); do curl -fs http://localhost:4000/api/health && break || sleep 1; done
          curl -fs http://localhost:4000/api/health || (cat /tmp/app.log; exit 1)
      - name: Scan ZAP baseline (passif + araignée AJAX)
        run: |
          chmod -R a+w .zap
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable             zap-baseline.py -t http://localhost:4000 -c rules.tsv -j -I -r zap-report.html -w zap-report.md -J zap-report.json
      - name: Rapport ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-zap
          path: .zap/zap-report.*
          if-no-files-found: ignore

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [server, client, zap]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: human-link:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Analyse de l'image (vulnérabilités graves)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: human-link:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
