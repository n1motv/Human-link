name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Serveur (typage, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typage
        run: npm run typecheck
      - name: Tests (MongoDB en mémoire)
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  client:
    name: Client (typage, i18n, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Typage
        run: npm run typecheck
      - name: Cohérence des traductions
        run: npm run i18n:check
      - name: Tests
        run: npx vitest run --passWithNoTests
      - name: Build
        run: npx vite build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: human-link:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Analyse de l'image (vulnérabilités graves)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: human-link:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
