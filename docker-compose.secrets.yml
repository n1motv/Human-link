# Variante « Docker secrets » de docker-compose.yml : les clés et mots de passe ne passent PAS par des variables d'environnement.
# Chaque secret est un fichier monté en lecture seule dans /run/secrets/ ; l'application les lit via <NOM>_FILE.
# Absents de `docker inspect`, de /proc/<pid>/environ et du fichier .env.
#
#   npm run secrets:gen                                   # crée ./secrets/ (jwt_secret, *_encryption_key, mongodb_uri...)
#   cp clients/acme/.env.example clients/acme/.env        # SANS les clés : seulement APP_URL, SMTP_HOST, ADMIN_EMAIL...
#   CLIENT_DIR=./clients/acme docker compose -f docker-compose.secrets.yml up -d --build
#   docker compose -f docker-compose.secrets.yml exec app node dist/scripts/seed.js
#
# Options : --profile https (Caddy), --profile antivirus (ClamAV), comme dans docker-compose.yml.

secrets:
  jwt_secret: { file: ./secrets/jwt_secret }
  field_encryption_key: { file: ./secrets/field_encryption_key }
  file_encryption_key: { file: ./secrets/file_encryption_key }
  pseudonym_key: { file: ./secrets/pseudonym_key }
  mongo_password: { file: ./secrets/mongo_password }
  mongodb_uri: { file: ./secrets/mongodb_uri }

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: humanlink
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets: [mongo_password]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ${CLIENT_DIR:-./clients/example}/.env
    environment:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      FIELD_ENCRYPTION_KEY_FILE: /run/secrets/field_encryption_key
      FILE_ENCRYPTION_KEY_FILE: /run/secrets/file_encryption_key
      PSEUDONYM_KEY_FILE: /run/secrets/pseudonym_key
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      TRUST_PROXY: ${TRUST_PROXY:-0}
      NODE_ENV: production
      PORT: "4000"
      CLIENT_DIR: /client
      CLIENT_DIST: /app/client/dist
      SERVE_CLIENT: "true"
      STORAGE_DIR: /data/storage
    secrets: [jwt_secret, field_encryption_key, file_encryption_key, pseudonym_key, mongodb_uri]
    volumes:
      - ${CLIENT_DIR:-./clients/example}:/client:ro
      - app-data:/data
    ports:
      - "${APP_PORT:-4000}:4000"

  clamav:
    image: clamav/clamav:1.4
    profiles: ["antivirus"]
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  mongo-data:
  app-data:
  caddy-data:
  clamav-data:
